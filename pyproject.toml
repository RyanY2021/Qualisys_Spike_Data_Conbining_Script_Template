[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qualisys-spike-combining"
version = "0.1.0"
description = "Combine Qualisys TSV and TXT files by pair ID and aligned time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qualisys-combine-by-id = "qualisys_spike_combining.combine_by_id:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
